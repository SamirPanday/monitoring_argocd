{{- if .Values.serviceAccounts.create }}
{{- range .Values.namespaces }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tenant.name" $ }}-workload
  namespace: {{ . }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
automountServiceAccountToken: {{ $.Values.serviceAccounts.automountServiceAccountToken }}
---
{{- end }}
{{- end }}

