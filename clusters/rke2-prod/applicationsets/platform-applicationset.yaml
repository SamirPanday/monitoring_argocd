apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: monitoring-platform
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: kube-prometheus-stack
            namespace: monitoring
            path: apps/platform/kube-prometheus-stack
            chartRepo: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            chartVersion: 0.0.0
          - name: loki
            namespace: logging
            path: apps/platform/loki
            chartRepo: https://grafana.github.io/helm-charts
            chart: loki
            chartVersion: 0.0.0
          - name: alloy
            namespace: logging
            path: apps/platform/alloy
            chartRepo: https://grafana.github.io/helm-charts
            chart: alloy
            chartVersion: 0.0.0
  template:
    metadata:
      name: '{{name}}'
    spec:
      project: monitoring-platform
      sources:
        - repoURL: '{{chartRepo}}'
          chart: '{{chart}}'
          targetRevision: '{{chartVersion}}'
          helm:
            valueFiles:
              - $values/{{path}}/values.yaml
        - repoURL: REPLACE_WITH_GIT_REPOSITORY_URL
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true

