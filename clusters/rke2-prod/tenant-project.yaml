apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitoring-tenants
  namespace: argocd
spec:
  description: Tenant namespaces and monitoring resources
  sourceRepos:
    - REPLACE_WITH_GIT_REPOSITORY_URL
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: LimitRange
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: ServiceAccount
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: NetworkPolicy

